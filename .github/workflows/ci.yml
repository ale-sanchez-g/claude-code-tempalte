name: CI

on:
  push:
    branches: [main, 'claude/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          if grep -rE '(password|secret|api_key|apikey|token)\s*=\s*["'\''\`][^"'\''\`]{8,}' \
            --include='*.ts' --include='*.js' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=.git \
            . ; then
            echo "ERROR: Possible hardcoded secret detected."
            exit 1
          fi
          echo "No secrets found."

  validate-claude-config:
    name: Validate Claude Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CLAUDE.md exists
        run: test -f CLAUDE.md && echo "CLAUDE.md present" || (echo "ERROR: CLAUDE.md missing" && exit 1)

      - name: Validate .mcp.json is valid JSON
        run: |
          python3 -c "import json, sys; json.load(open('.mcp.json'))" && \
            echo ".mcp.json is valid JSON" || \
            (echo "ERROR: .mcp.json is not valid JSON" && exit 1)

      - name: Validate .claude/settings.json is valid JSON
        run: |
          python3 -c "import json, sys; json.load(open('.claude/settings.json'))" && \
            echo ".claude/settings.json is valid JSON" || \
            (echo "ERROR: .claude/settings.json is not valid JSON" && exit 1)

      - name: Validate hook scripts are executable syntax
        run: |
          for script in .claude/hooks/*.sh; do
            bash -n "$script" && echo "$script syntax OK" || (echo "ERROR: $script has syntax errors" && exit 1)
          done
